[package]
name = "buildkit-proto"
version = "0.2.0"
authors = ["Denys Zariaiev <denys.zariaiev@gmail.com>"]
edition = "2021"

description = "Protobuf interfaces to BuildKit"
documentation = "https://docs.rs/buildkit-proto"
repository = "https://github.com/denzp/rust-buildkit"
readme = "README.md"
keywords = ["buildkit", "docker", "protobuf", "prost"]
categories = ["development-tools::build-utils", "api-bindings"]
license = "MIT/Apache-2.0"

[dependencies]
prost = "0.13.4"
prost-types = "0.13.4"
protobuf = "4.34.1-release"
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }

[build-dependencies]
prost-build = "0.13.4"

[build-dependencies.tonic-build]
version = "0.12"
